<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>נועם ועדי · 22.8.2027</title>
<meta name="description" content="אנחנו מתחתנים! יום ראשון, 22.8.2027, קאי ריזורט בעמק חפר">
<meta property="og:title" content="נועם ועדי מתחתנים 💍">
<meta property="og:description" content="יום ראשון · 22.8.2027 · קאי ריזורט, עמק חפר">
<meta name="theme-color" content="#efe7da">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: one screen. A sealed envelope fills the viewport; tapping the seal opens it and the card rises out. */
:root{
  --paper:#f3ece0; --paper-2:#e9dfcf; --ink:#2b2420; --soft:#7a6c5d; --gold:#b08a3e; --gold-hi:#d9b86a; --gold-lo:#8a6526; --line:#cdb98f;
  --display:"Frank Ruhl Libre","David",serif; --body:"Assistant","Arial Hebrew",Arial,sans-serif; --script:"Cormorant Garamond",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper-2);color:var(--ink);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(120% 80% at 50% 0%,#f7f1e7 0%,var(--paper-2) 70%)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- the card ---------- */
.stage{position:fixed;inset:0;display:grid;place-items:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--paper);
  border-radius:4px;padding:clamp(22px,5vh,40px) clamp(20px,6vw,40px);text-align:center;
  box-shadow:0 1px 0 #fff inset,0 30px 60px -30px rgb(60 40 20 / .45),0 2px 6px rgb(60 40 20 / .12);
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,14px)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none;border-radius:2px}
.card::after{content:"";position:absolute;inset:14px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);pointer-events:none}
.script{font-family:var(--script);font-style:italic;color:var(--gold);font-size:clamp(20px,3.2vh,26px);letter-spacing:.02em;line-height:1}
.names{font-family:var(--display);font-weight:500;line-height:.95;font-size:clamp(48px,10.5vh,84px);margin:0;display:flex;flex-direction:column;align-items:center}
.names .amp{font-family:var(--script);font-style:italic;color:var(--gold);font-size:.5em;line-height:1.1}
.lead{margin:0;font-size:clamp(15px,2.1vh,17px);color:var(--soft);max-width:30ch;line-height:1.55;text-wrap:balance}
.rule{width:64px;height:1px;background:var(--gold);opacity:.7}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;max-width:330px}
.date .side{font-size:14px;color:var(--soft);border-block:1px solid var(--line);padding-block:6px;letter-spacing:.03em}
.date .big{font-family:var(--display);font-size:clamp(34px,6vh,46px);line-height:1;font-variant-numeric:lining-nums}
.date .big small{display:block;font-family:var(--body);font-size:12px;color:var(--soft);letter-spacing:.2em;margin-top:6px}
.when{margin:0;font-size:clamp(15px,2.2vh,18px)}
.when b{font-weight:600}
.venue{font-family:var(--display);font-size:clamp(20px,3.2vh,26px);margin:0}
.venue span{display:block;font-family:var(--body);font-size:14px;color:var(--soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);background:transparent;border-radius:999px;
  padding:10px 18px;font-size:15px;font-weight:600;text-decoration:none;transition:background .2s,color .2s}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn svg{width:18px;height:18px;flex:none}
.cal{position:relative}
.cal-menu{position:absolute;bottom:calc(100% + 8px);left:0;background:#fffaf2;border:1px solid var(--line);
  border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 12px 30px -12px rgb(60 40 20 / .35);z-index:2}
.cal-menu a{padding:10px 12px;border-radius:8px;text-decoration:none;font-size:15px;text-align:right}
.cal-menu a:hover{background:var(--paper-2)}
.count{font-size:13px;color:var(--soft);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-weight:600}

/* ---------- the envelope ---------- */
.env{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--paper-2);
  background-image:radial-gradient(120% 80% at 50% 30%,#f7f1e7 0%,var(--paper-2) 75%);perspective:1400px;cursor:pointer}
.env .back{position:absolute;inset:0}
/* the four folds drawn as soft triangles meeting under the seal */
.fold{position:absolute;inset:0}
.fold.l{clip-path:polygon(0 0,50% 50%,0 100%);background:linear-gradient(90deg,#ece3d4,#e4d9c7)}
.fold.r{clip-path:polygon(100% 0,50% 50%,100% 100%);background:linear-gradient(270deg,#ece3d4,#e4d9c7)}
.fold.b{clip-path:polygon(0 100%,50% 50%,100% 100%);background:linear-gradient(0deg,#e9dfcf,#e2d6c2)}
.flap{position:absolute;inset:0 0 50% 0;transform-origin:50% 0;transition:transform .9s cubic-bezier(.6,.05,.3,1);z-index:2}
.flap::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#f2eadd,#e7dcca);
  filter:drop-shadow(0 6px 10px rgb(60 40 20 / .18))}
.seams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.seams line{stroke:var(--gold);stroke-width:1;opacity:.55;vector-effect:non-scaling-stroke}
.seal{position:relative;z-index:4;width:clamp(96px,22vw,120px);aspect-ratio:1;border:0;padding:0;background:none;
  transition:transform .5s ease,opacity .5s ease}
.seal .wax{position:absolute;inset:0;border-radius:52% 48% 50% 50% / 48% 53% 47% 52%;
  background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 45%,var(--gold-lo) 100%);
  box-shadow:0 8px 16px -6px rgb(70 45 10 / .55),inset 0 -4px 8px rgb(80 50 10 / .35),inset 0 3px 6px rgb(255 240 200 / .5)}
.seal .ring{position:absolute;inset:14%;border-radius:50%;border:1.5px solid rgb(255 236 190 / .55);box-shadow:inset 0 1px 2px rgb(80 50 10 / .4)}
.seal .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(26px,6vw,32px);
  color:#f6e3b0;text-shadow:0 1px 0 rgb(80 50 10 / .55),0 -1px 0 rgb(255 245 215 / .35);letter-spacing:.04em}
.seal .mono i{font-family:var(--script);font-size:.7em;margin-inline:2px}
.hint{position:absolute;bottom:max(28px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--soft);
  font-size:13px;letter-spacing:.3em;z-index:4}
.env.open .seal{transform:scale(.6) translateY(-20px);opacity:0}
.env.open .flap{transform:rotateX(180deg)}
.env.open .hint{opacity:0}
.env.gone{opacity:0;pointer-events:none;transition:opacity .6s ease .2s}
.stage .card{transform:translateY(40px) scale(.97);opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1) .35s,opacity .8s ease .35s}
body.opened .stage .card{transform:none;opacity:1}
body.opened{overflow:auto}
@media (prefers-reduced-motion:reduce){.flap,.seal,.stage .card,.env.gone{transition:opacity .3s ease!important}.env.open .flap{transform:none}}
@media (max-height:640px){.lead{display:none}}
</style>
</head>
<body>
<div class="stage">
  <main class="card" aria-label="הזמנה לחתונה של נועם ועדי">
    <span class="script">we're getting married</span>
    <h1 class="names"><span>נועם</span><span class="amp">&amp;</span><span>עדי</span></h1>
    <p class="lead">בשמחה ובהתרגשות אנחנו מזמינים אתכם לחגוג איתנו את יום חתונתנו</p>
    <div class="date" aria-label="יום ראשון, 22 באוגוסט 2027, י״ט באב תשפ״ז">
      <span class="side">יום ראשון</span>
      <span class="big">22.8<small>2027</small></span>
      <span class="side">י״ט באב תשפ״ז</span>
    </div>
    <p class="when">קבלת פנים <b>19:30</b></p>
    <div class="rule" aria-hidden="true"></div>
    <p class="venue">קאי ריזורט<span>עמק חפר</span></p>
    <div class="actions">
      <a class="btn solid" id="waze" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        ניווט ב-Waze</a>
      <div class="cal">
        <button class="btn" id="cal-btn" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
          הוספה ליומן</button>
        <div class="cal-menu" id="cal-menu" hidden>
          <a id="cal-apple" href="wedding.ics">iPhone / Mac / Outlook</a>
          <a id="cal-google" target="_blank" rel="noopener">Google Calendar</a>
        </div>
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
  </main>
</div>

<div class="env" id="env" role="button" tabindex="0" aria-label="פתיחת ההזמנה">
  <div class="back"></div>
  <div class="fold l"></div><div class="fold r"></div><div class="fold b"></div>
  <div class="flap"></div>
  <svg class="seams" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="0" x2="50" y2="50"/><line x1="100" y1="0" x2="50" y2="50"/>
    <line x1="0" y1="100" x2="50" y2="50"/><line x1="100" y1="100" x2="50" y2="50"/>
  </svg>
  <span class="seal" aria-hidden="true"><span class="wax"></span><span class="ring"></span><span class="mono">נ<i>&amp;</i>ע</span></span>
  <div class="hint">לחצו לפתיחה</div>
</div>

<script>
const WAZE="https://waze.com/ul?q="+encodeURIComponent("קאי ריזורט עמק חפר")+"&navigate=yes";
const START="20270822T163000Z", END="20270823T010000Z";   // 19:30 to 04:00 Israel summer time
document.getElementById("waze").href=WAZE;
document.getElementById("cal-google").href="https://calendar.google.com/calendar/render?"+new URLSearchParams({
  action:"TEMPLATE",text:"החתונה של נועם ועדי 💍",dates:START+"/"+END,location:WAZE,
  details:"קבלת פנים 19:30 · קאי ריזורט, עמק חפר\nניווט ב-Waze: "+WAZE}).toString();

const env=document.getElementById("env");
function openEnvelope(){
  if(env.classList.contains("open"))return;
  env.classList.add("open");
  setTimeout(()=>{document.body.classList.add("opened");env.classList.add("gone")},650);
  setTimeout(()=>{env.remove();document.getElementById("waze").focus({preventScroll:true})},1500);
}
env.addEventListener("click",openEnvelope);
env.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEnvelope()}});

const calBtn=document.getElementById("cal-btn"), menu=document.getElementById("cal-menu");
calBtn.addEventListener("click",e=>{e.stopPropagation();menu.hidden=!menu.hidden;calBtn.setAttribute("aria-expanded",String(!menu.hidden))});
document.addEventListener("click",e=>{if(!menu.hidden&&!e.target.closest(".cal")){menu.hidden=true;calBtn.setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!menu.hidden){menu.hidden=true;calBtn.focus()}});

function tick(){
  const ms=new Date("2027-08-22T19:30:00+03:00")-new Date(), el=document.getElementById("count");
  if(ms<=0){el.textContent=ms>-12*36e5?"היום! 🎉":"";return}
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5);
  el.innerHTML=`עוד <b>${d}</b> ימים ו-<b>${h}</b> שעות`;
}
tick();setInterval(tick,60000);
</script>
</body>
</html>
