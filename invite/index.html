<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Assistant:wght@400;600&family=Cormorant+Garamond:ital,wght@1,500&family=Bellefair&family=Karantina:wght@400;700&family=Pinyon+Script&family=Suez+One&display=swap">
<style>
/* Layout: one screen. A sealed envelope fills the viewport; tapping the seal opens it and the card rises out.
   Every theme only redefines the tokens below and switches its ornaments on. */
:root{
  --bg:#e9dfcf; --bg-glow:#f7f1e7; --paper:#f3ece0; --ink:#2b2420; --soft:#7a6c5d; --accent:#b08a3e; --line:#cdb98f;
  --btn-ink:#2b2420; --btn-on:#f3ece0;
  --env-a:#ece3d4; --env-b:#e4d9c7; --env-c:#e2d6c2; --flap-a:#f2eadd; --flap-b:#e7dcca; --seam:#b08a3e;
  --wax-hi:#d9b86a; --wax:#b08a3e; --wax-lo:#8a6526; --mono:#f6e3b0;
  --names-font:"Frank Ruhl Libre","David",serif; --names-weight:500; --names-size:clamp(48px,10.5vh,84px);
  --body:"Assistant","Arial Hebrew",Arial,sans-serif; --script:"Cormorant Garamond",Georgia,serif; --script-size:clamp(20px,3.2vh,26px);
  --card-radius:4px; --card-shadow:0 1px 0 #fff inset,0 30px 60px -30px rgb(60 40 20 / .45),0 2px 6px rgb(60 40 20 / .12);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(120% 80% at 50% 0%,var(--bg-glow) 0%,var(--bg) 70%)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- the card ---------- */
.stage{position:fixed;inset:0;display:grid;place-items:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--paper);
  border-radius:var(--card-radius);padding:clamp(22px,5vh,40px) clamp(20px,6vw,40px);text-align:center;box-shadow:var(--card-shadow);
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,14px)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none;border-radius:calc(var(--card-radius) - 2px)}
.card::after{content:"";position:absolute;inset:14px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);pointer-events:none;border-radius:calc(var(--card-radius) - 4px)}
.card>*{position:relative;z-index:1}
.script{font-family:var(--script);font-style:italic;color:var(--accent);font-size:var(--script-size);letter-spacing:.02em;line-height:1}
.names{font-family:var(--names-font);font-weight:var(--names-weight);line-height:.95;font-size:var(--names-size);margin:0;display:flex;flex-direction:column;align-items:center}
.names .amp{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--accent);font-size:.5em;line-height:1.1}
.lead{margin:0;font-size:clamp(15px,2.1vh,17px);color:var(--soft);max-width:30ch;line-height:1.55;text-wrap:balance}
.rule{width:64px;height:1px;background:var(--accent);opacity:.7}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;max-width:330px}
.date .side{font-size:14px;color:var(--soft);border-block:1px solid var(--line);padding-block:6px;letter-spacing:.03em}
.date .big{font-family:var(--names-font);font-size:clamp(34px,6vh,46px);line-height:1;font-variant-numeric:lining-nums}
.date .big small{display:block;font-family:var(--body);font-size:12px;color:var(--soft);letter-spacing:.2em;margin-top:6px}
.when{margin:0;font-size:clamp(15px,2.2vh,18px)}
.when b{font-weight:600}
.venue{font-family:var(--names-font);font-size:clamp(20px,3.2vh,26px);margin:0}
.venue span{display:block;font-family:var(--body);font-size:14px;color:var(--soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:transparent;border-radius:999px;
  padding:10px 18px;font-size:15px;font-weight:600;text-decoration:none;transition:background .2s,color .2s;color:var(--ink)}
.btn.solid{background:var(--btn-ink);border-color:var(--btn-ink);color:var(--btn-on)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:18px;height:18px;flex:none}
.cal{position:relative}
.cal-menu{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 12px 30px -12px rgb(0 0 0 / .4);z-index:3}
.cal-menu a{padding:10px 12px;border-radius:8px;text-decoration:none;font-size:15px;text-align:right}
.cal-menu a:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.count{font-size:13px;color:var(--soft);letter-spacing:.04em;font-variant-numeric:tabular-nums;margin:0}
.count b{color:var(--ink);font-weight:600}
.deco{display:none}

/* ---------- the envelope ---------- */
.env{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);
  background-image:radial-gradient(120% 80% at 50% 30%,var(--bg-glow) 0%,var(--bg) 75%);perspective:1400px;cursor:pointer}
.fold{position:absolute;inset:0}
.fold.l{clip-path:polygon(0 0,50% 50%,0 100%);background:linear-gradient(90deg,var(--env-a),var(--env-b))}
.fold.r{clip-path:polygon(100% 0,50% 50%,100% 100%);background:linear-gradient(270deg,var(--env-a),var(--env-b))}
.fold.b{clip-path:polygon(0 100%,50% 50%,100% 100%);background:linear-gradient(0deg,var(--env-b),var(--env-c))}
.flap{position:absolute;inset:0 0 50% 0;transform-origin:50% 0;transition:transform .9s cubic-bezier(.6,.05,.3,1);z-index:2}
.flap::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,var(--flap-a),var(--flap-b));
  filter:drop-shadow(0 6px 10px rgb(0 0 0 / .18))}
.seams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.seams line{stroke:var(--seam);stroke-width:1;opacity:.55;vector-effect:non-scaling-stroke}
.seal{position:relative;z-index:4;width:clamp(96px,22vw,120px);aspect-ratio:1;transition:transform .5s ease,opacity .5s ease}
.seal .wax{position:absolute;inset:0;border-radius:52% 48% 50% 50% / 48% 53% 47% 52%;
  background:radial-gradient(circle at 35% 30%,var(--wax-hi),var(--wax) 45%,var(--wax-lo) 100%);
  box-shadow:0 8px 16px -6px rgb(0 0 0 / .55),inset 0 -4px 8px rgb(0 0 0 / .3),inset 0 3px 6px rgb(255 255 255 / .35)}
.seal .ring{position:absolute;inset:14%;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--mono) 60%,transparent);box-shadow:inset 0 1px 2px rgb(0 0 0 / .35)}
.seal .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--names-font);font-size:clamp(26px,6vw,32px);
  color:var(--mono);text-shadow:0 1px 0 rgb(0 0 0 / .45),0 -1px 0 rgb(255 255 255 / .25);letter-spacing:.04em}
.seal .mono i{font-family:var(--script);font-size:.7em;margin-inline:2px}
.hint{position:absolute;bottom:max(28px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--soft);font-size:13px;letter-spacing:.3em;z-index:4}
.env.open .seal{transform:scale(.6) translateY(-20px);opacity:0}
.env.open .flap{transform:rotateX(180deg)}
.env.open .hint{opacity:0}
.env.gone{opacity:0;pointer-events:none;transition:opacity .6s ease .2s}
.stage .card{transform:translateY(40px) scale(.97);opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1) .35s,opacity .8s ease .35s}
body.opened .stage .card{transform:none;opacity:1}
body.opened{overflow:auto}

/* ================= THEMES ================= */

/* 1. לילה זהוב: deep night, gold foil type, slow twinkles */
body.t-night{
  --bg:#0b1020; --bg-glow:#1d2747; --paper:#121a33; --ink:#f3e7c9; --soft:#b5ab93; --accent:#d8b45c; --line:#8a7440;
  --btn-ink:#d8b45c; --btn-on:#121a33;
  --env-a:#18213d; --env-b:#121a31; --env-c:#0f162b; --flap-a:#1f2a4b; --flap-b:#172040; --seam:#d8b45c;
  --wax-hi:#f0d58c; --wax:#c9a24a; --wax-lo:#7f5f1f; --mono:#fff1c9;
  --names-font:"Bellefair","Frank Ruhl Libre",serif; --names-weight:400; --script:"Pinyon Script",cursive; --script-size:clamp(26px,4vh,34px);
  --card-shadow:0 0 0 1px rgb(216 180 92 / .25),0 30px 80px -20px rgb(0 0 0 / .8),0 0 120px -40px rgb(216 180 92 / .35);
  color-scheme:dark}
.t-night .names span:not(.amp),.t-night .date .big{background:linear-gradient(180deg,#fff3cf 0%,#e1bf6a 45%,#a9822f 75%,#f3d993 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.t-night .script{font-style:normal}
.t-night .deco.stars{display:block;position:fixed;inset:0;pointer-events:none;z-index:0}
.t-night .deco.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#f6dfa0;box-shadow:0 0 8px 2px rgb(246 223 160 / .6);
  animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.t-night .stage{z-index:1}

/* 2. גן זיתים: sage and olive branches, airy light serif */
body.t-olive{
  --bg:#e6eadf; --bg-glow:#f6f7f1; --paper:#fbfaf4; --ink:#2e3a2b; --soft:#6d7a66; --accent:#7d8f5f; --line:#b9c4a6;
  --btn-ink:#3c4a37; --btn-on:#fbfaf4;
  --env-a:#eef0e7; --env-b:#e3e7da; --env-c:#dce1d1; --flap-a:#f4f5ee; --flap-b:#e5e9dc; --seam:#7d8f5f;
  --wax-hi:#a9b98a; --wax:#6f8256; --wax-lo:#45552f; --mono:#f1f4e6;
  --names-font:"Frank Ruhl Libre",serif; --names-weight:300; --names-size:clamp(52px,11vh,90px); --script:"Pinyon Script",cursive; --script-size:clamp(26px,4vh,34px);
  --card-radius:2px}
.t-olive .script{font-style:normal}
.t-olive .card::after{display:none}
.t-olive .deco.branch{display:block;width:min(240px,62%);height:auto;margin-block:-6px}
.t-olive .deco.branch.bottom{transform:scaleY(-1)}
.t-olive .lead{display:none}

/* 3. ריביירה: Mediterranean blue tiles, a summer wedding in August */
body.t-riviera{
  --bg:#dfe8f2; --bg-glow:#f4f8fc; --paper:#fffdf8; --ink:#173a6b; --soft:#4f6b92; --accent:#e0a91c; --line:#1f4e8c;
  --btn-ink:#1f4e8c; --btn-on:#fffdf8;
  --env-a:#2a5a9a; --env-b:#224d87; --env-c:#1c4277; --flap-a:#3266aa; --flap-b:#26538f; --seam:#f6d36b;
  --wax-hi:#f6d36b; --wax:#e0a91c; --wax-lo:#a7740a; --mono:#fff6d6;
  --names-font:"Karantina","Frank Ruhl Libre",sans-serif; --names-weight:700; --names-size:clamp(72px,15vh,124px);
  --script:"Pinyon Script",cursive; --script-size:clamp(26px,4vh,32px);
  --card-radius:18px; --card-shadow:0 30px 60px -28px rgb(23 58 107 / .55)}
body.t-riviera{background-color:#dfe8f2;background-image:
  radial-gradient(circle at 50% 50%,transparent 11px,#1f4e8c 12px,#1f4e8c 13px,transparent 14px),
  conic-gradient(from 45deg at 50% 50%,#c9d8ea 0 25%,#e9f0f8 0 50%,#c9d8ea 0 75%,#e9f0f8 0);background-size:56px 56px}
.t-riviera .env{background:#1c4277;background-image:none}
.t-riviera .hint{color:#f6d36b}
.t-riviera .script{font-style:normal}
.t-riviera .names{line-height:.85}
.t-riviera .card::before{border:2px solid var(--line);inset:9px}
.t-riviera .card::after{inset:15px;border:1px dashed color-mix(in srgb,var(--line) 55%,transparent)}
.t-riviera .deco.lemons{display:block;font-size:26px;line-height:1;letter-spacing:6px;margin-bottom:-4px}

/* 4. בורדו קטיפה: burgundy velvet, blush arch card, script */
body.t-velvet{
  --bg:#3b0d1b; --bg-glow:#6a1b33; --paper:#f7e7e3; --ink:#4a0f22; --soft:#8a5562; --accent:#9b2c4a; --line:#c98a98;
  --btn-ink:#5b1229; --btn-on:#f7e7e3;
  --env-a:#5e1529; --env-b:#521224; --env-c:#470f1f; --flap-a:#6c1a31; --flap-b:#581427; --seam:#e8b7a6;
  --wax-hi:#e6c07a; --wax:#b88a3c; --wax-lo:#6f4f18; --mono:#fff0d0;
  --names-font:"Bellefair","Frank Ruhl Libre",serif; --names-weight:400; --script:"Pinyon Script",cursive; --script-size:clamp(28px,4.4vh,36px);
  --card-radius:220px 220px 10px 10px; --card-shadow:0 40px 80px -30px rgb(0 0 0 / .7)}
.t-velvet .card{padding-top:clamp(46px,9vh,70px)}
.t-velvet .script{font-style:normal}
.t-velvet .hint{color:#e8b7a6}
.t-velvet .count b{color:var(--accent)}

/* 5. מודרני: big bold type, warm off-white, one strong colour */
body.t-modern{
  --bg:#ece7df; --bg-glow:#f6f2ec; --paper:#f6f2ec; --ink:#141414; --soft:#5f5a53; --accent:#d2492a; --line:#141414;
  --btn-ink:#141414; --btn-on:#f6f2ec;
  --env-a:#e9e3d9; --env-b:#e0d9cd; --env-c:#d8d0c2; --flap-a:#f1ece4; --flap-b:#e2dbcf; --seam:#141414;
  --wax-hi:#ec6b4b; --wax:#d2492a; --wax-lo:#8e2a12; --mono:#fff3ea;
  --names-font:"Suez One","Frank Ruhl Libre",serif; --names-weight:400; --names-size:clamp(64px,13vh,110px);
  --script:"Assistant",sans-serif; --script-size:13px; --card-radius:0; --card-shadow:none}
.t-modern .card{background:transparent;gap:clamp(10px,2vh,16px)}
.t-modern .card::before,.t-modern .card::after{display:none}
.t-modern .script{font-style:normal;letter-spacing:.45em;text-transform:uppercase;font-weight:600;color:var(--ink)}
.t-modern .names .amp{font-family:"Suez One",serif;font-style:normal;font-size:.42em;color:var(--accent)}
.t-modern .names{line-height:.9}
.t-modern .rule{height:3px;width:40px;background:var(--accent);opacity:1}
.t-modern .date .side{border-color:var(--ink)}
.t-modern .btn{border-radius:0;border-width:2px}

@media (prefers-reduced-motion:reduce){.flap,.seal,.stage .card,.env.gone{transition:opacity .3s ease!important}.env.open .flap{transform:none}.deco.stars i{animation:none;opacity:.6}}
@media (max-height:640px){.lead{display:none}}
</style>
</head>
<body>
<div class="deco stars" aria-hidden="true"></div>
<div class="stage">
  <main class="card" aria-label="הזמנה לחתונה של נועם ועדי">
    <svg class="deco branch top" viewBox="0 0 240 46" aria-hidden="true"><g fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round">
      <path d="M8 30 C70 14 170 14 232 30"/></g><g fill="var(--accent)" opacity=".85">
      <ellipse cx="40" cy="20" rx="9" ry="3.2" transform="rotate(-28 40 20)"/><ellipse cx="52" cy="29" rx="9" ry="3.2" transform="rotate(24 52 29)"/>
      <ellipse cx="74" cy="15" rx="9" ry="3.2" transform="rotate(-22 74 15)"/><ellipse cx="88" cy="25" rx="9" ry="3.2" transform="rotate(20 88 25)"/>
      <ellipse cx="152" cy="25" rx="9" ry="3.2" transform="rotate(-20 152 25)"/><ellipse cx="166" cy="15" rx="9" ry="3.2" transform="rotate(22 166 15)"/>
      <ellipse cx="188" cy="29" rx="9" ry="3.2" transform="rotate(-24 188 29)"/><ellipse cx="200" cy="20" rx="9" ry="3.2" transform="rotate(28 200 20)"/>
      <circle cx="120" cy="18" r="4"/><circle cx="110" cy="21" r="2.4" opacity=".6"/><circle cx="130" cy="21" r="2.4" opacity=".6"/></g></svg>
    <span class="deco lemons" aria-hidden="true">🍋 ✦ 🍋</span>
    <span class="script">we're getting married</span>
    <h1 class="names"><span>נועם</span><span class="amp">&amp;</span><span>עדי</span></h1>
    <p class="lead">בשמחה ובהתרגשות אנחנו מזמינים אתכם לחגוג איתנו את יום חתונתנו</p>
    <div class="date" aria-label="יום ראשון, 22 באוגוסט 2027, י״ט באב תשפ״ז">
      <span class="side">יום ראשון</span>
      <span class="big">22.8<small>2027</small></span>
      <span class="side">י״ט באב תשפ״ז</span>
    </div>
    <p class="when">קבלת פנים <b>19:30</b></p>
    <div class="rule" aria-hidden="true"></div>
    <p class="venue">קאי ריזורט<span>עמק חפר</span></p>
    <div class="actions">
      <a class="btn solid" id="waze" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        ניווט ב-Waze</a>
      <div class="cal">
        <button class="btn" id="cal-btn" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
          הוספה ליומן</button>
        <div class="cal-menu" id="cal-menu" hidden>
          <a id="cal-apple" href="wedding.ics">iPhone / Mac / Outlook</a>
          <a id="cal-google" target="_blank" rel="noopener">Google Calendar</a>
        </div>
      </div>
    </div>
    <svg class="deco branch bottom" viewBox="0 0 240 46" aria-hidden="true"><use href="#none"/></svg>
    <p class="count" id="count" aria-live="polite"></p>
  </main>
</div>

<div class="env" id="env" role="button" tabindex="0" aria-label="פתיחת ההזמנה">
  <div class="fold l"></div><div class="fold r"></div><div class="fold b"></div>
  <div class="flap"></div>
  <svg class="seams" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="0" x2="50" y2="50"/><line x1="100" y1="0" x2="50" y2="50"/>
    <line x1="0" y1="100" x2="50" y2="50"/><line x1="100" y1="100" x2="50" y2="50"/>
  </svg>
  <span class="seal" aria-hidden="true"><span class="wax"></span><span class="ring"></span><span class="mono">נ<i>&amp;</i>ע</span></span>
  <div class="hint">לחצו לפתיחה</div>
</div>

<script>
// ?t=night|olive|riviera|velvet|modern picks a theme; ?open=1 skips the envelope (used by the comparison page)
const qs=new URLSearchParams(location.search);
const THEMES=["classic","night","olive","riviera","velvet","modern"];
const theme=THEMES.includes(qs.get("t"))?qs.get("t"):"classic";
if(theme!=="classic")document.body.classList.add("t-"+theme);
// the bottom olive branch reuses the top one
document.querySelector(".deco.branch.bottom").innerHTML=document.querySelector(".deco.branch.top").innerHTML;
if(theme==="night"){const s=document.querySelector(".deco.stars");
  for(let i=0;i<46;i++){const d=document.createElement("i");d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";
    d.style.animationDelay=(Math.random()*3.4).toFixed(2)+"s";d.style.transform=`scale(${.4+Math.random()*.8})`;s.appendChild(d)}}

const WAZE="https://waze.com/ul?q="+encodeURIComponent("קאי ריזורט עמק חפר")+"&navigate=yes";
const START="20270822T163000Z", END="20270823T010000Z";   // 19:30 to 04:00 Israel summer time
document.getElementById("waze").href=WAZE;
document.getElementById("cal-google").href="https://calendar.google.com/calendar/render?"+new URLSearchParams({
  action:"TEMPLATE",text:"החתונה של נועם ועדי 💍",dates:START+"/"+END,location:WAZE,
  details:"קבלת פנים 19:30 · קאי ריזורט, עמק חפר\nניווט ב-Waze: "+WAZE}).toString();

const env=document.getElementById("env");
function openEnvelope(instant){
  if(env.classList.contains("open"))return;
  env.classList.add("open");
  if(instant){document.body.classList.add("opened");env.remove();return}
  setTimeout(()=>{document.body.classList.add("opened");env.classList.add("gone")},650);
  setTimeout(()=>{env.remove();document.getElementById("waze").focus({preventScroll:true})},1500);
}
env.addEventListener("click",()=>openEnvelope());
env.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEnvelope()}});
if(qs.get("open")==="1"){document.querySelector(".stage .card").style.transition="none";openEnvelope(true)}

const calBtn=document.getElementById("cal-btn"), menu=document.getElementById("cal-menu");
calBtn.addEventListener("click",e=>{e.stopPropagation();menu.hidden=!menu.hidden;calBtn.setAttribute("aria-expanded",String(!menu.hidden))});
document.addEventListener("click",e=>{if(!menu.hidden&&!e.target.closest(".cal")){menu.hidden=true;calBtn.setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!menu.hidden){menu.hidden=true;calBtn.focus()}});

function tick(){
  const ms=new Date("2027-08-22T19:30:00+03:00")-new Date(), el=document.getElementById("count");
  if(ms<=0){el.textContent=ms>-12*36e5?"היום! 🎉":"";return}
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5);
  el.innerHTML=`עוד <b>${d}</b> ימים ו-<b>${h}</b> שעות`;
}
tick();setInterval(tick,60000);
</script>
