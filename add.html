<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>הוספת מוזמנים</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow card; unlock, then an add form with the list of what this person added below it. */
:root{
  --bg:#f6f5f8; --surface:#ffffff; --fg:#221b2a; --muted:#6d6577; --line:#e4e0ea;
  --accent:#7d2350; --ok:#2f7d4f; --bad:#b42318;
  --font-display:"Frank Ruhl Libre", "David", "Times New Roman", serif;
  --font-body:"Assistant", "Arial Hebrew", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16121a; --surface:#211b27; --fg:#efe9f3; --muted:#a69cb0; --line:#362d40;
  --accent:#e07aa8; --ok:#6fcf97; --bad:#f97066; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,7vw,34px);line-height:1.15}
h2{font-size:19px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{flex:1 1 120px}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:600;text-decoration:underline;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
ul{list-style:none;margin:0;padding:0}
li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
li:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">הוספת מוזמנים לחתונה</h1><p class="muted" id="sub" style="margin:4px 0 0">הדף הזה מאפשר רק להוסיף מוזמנים לרשימה.</p></header>

  <form class="panel" id="unlock" hidden>
    <label>סיסמה<input id="pw" type="password" autocomplete="current-password" required></label>
    <div id="unlock-msg"></div>
    <div><button class="btn" id="unlock-go">כניסה</button></div>
  </form>

  <form class="panel" id="add" hidden>
    <h2>מוזמן חדש</h2>
    <label>שם<input id="g-name" required placeholder="למשל: דוד ורחל כהן"></label>
    <div class="row">
      <label>כמה אנשים<input id="g-count" type="number" min="1" max="50" value="2" inputmode="numeric"></label>
      <label>קבוצה<select id="g-group">
        <option value="close">משפחה קרובה</option><option value="family" selected>משפחה</option>
        <option value="friends">חברים</option><option value="work">עבודה</option><option value="other">מכרים</option></select></label>
    </div>
    <label>טלפון (לא חובה)<input id="g-phone" inputmode="tel" dir="ltr"></label>
    <label>הערה (לא חובה)<input id="g-notes" placeholder="למשל: יבואו עם הילדים"></label>
    <div id="add-msg"></div>
    <div class="row" style="align-items:center"><button class="btn" id="add-go">הוספה לרשימה</button>
      <button type="button" class="link" id="bulk-toggle">להדביק רשימה שלמה</button></div>
    <div id="bulk" hidden style="display:flex;flex-direction:column;gap:8px">
      <label>שורה לכל הזמנה. אפשר להוסיף פסיק ומספר אנשים: "משפחת לוי, 4"<textarea id="bulk-text" rows="7"></textarea></label>
      <div><button type="button" class="btn" id="bulk-go">הוספת כל הרשימה</button></div>
    </div>
  </form>

  <section class="panel" id="mine" hidden>
    <h2>מה הוספתם מהמכשיר הזה <span class="muted num" id="mine-count"></span></h2>
    <ul id="mine-list"></ul>
    <p class="muted" style="margin:0;font-size:14px">אם טעיתם בשם או במספר, כתבו לבני הזוג והם יתקנו.</p>
  </section>

  <p class="muted" id="foot" style="font-size:13px;margin:0" hidden><button class="link" id="lock" style="font-size:13px">יציאה מהמכשיר הזה</button></p>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function b64encode(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
const b64urlDec=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
const msg=(el,text,kind)=>{el.className="msg "+(kind||"");el.textContent=text;el.hidden=!text};

const sealed=(location.hash.match(/^#v1\.([\w-]+)$/)||[])[1];
const KEY="wedding-add:"+(sealed||"").slice(0,24);   // one saved unlock per link
let P=null;                                          // {t, r, by, side, couple}

async function unseal(pw){
  const all=b64urlDec(sealed), salt=all.slice(0,16), iv=all.slice(16,28), ct=all.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));
}
async function send(guests){
  const body={by:P.by,side:P.side,at:new Date().toISOString(),guests};
  const path=`inbox/${Date.now()}-${rid()}.json`;
  const r=await fetch(`https://api.github.com/repos/${P.r}/contents/${path}`,{method:"PUT",
    headers:{Authorization:"Bearer "+P.t,Accept:"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify({message:"מוזמנים מ"+P.by,content:b64encode(new TextEncoder().encode(JSON.stringify(body)))})});
  if(r.status===401||r.status===403||r.status===404) throw "הקישור כבר לא פעיל. בקשו מבני הזוג קישור חדש.";
  if(!r.ok) throw "השליחה נכשלה. בדקו את החיבור לאינטרנט ונסו שוב.";
}
function renderMine(){
  const mine=store.get(KEY+":mine")||[];
  $("#mine").hidden=!mine.length;
  $("#mine-count").textContent=mine.length?`(${mine.reduce((s,g)=>s+(+g.count||1),0)} אנשים)`:"";
  $("#mine-list").innerHTML=mine.slice().reverse().map(g=>`<li><span>${esc(g.name)}</span><span class="muted num">${esc(g.count)}</span></li>`).join("");
}
function remember(gs){store.set(KEY+":mine",(store.get(KEY+":mine")||[]).concat(gs.map(g=>({name:g.name,count:g.count}))));renderMine()}
function opened(){
  $("#unlock").hidden=true;$("#add").hidden=false;$("#foot").hidden=false;
  $("#title").textContent=`הוספת מוזמנים לחתונה של ${P.couple||"בני הזוג"}`;
  $("#sub").textContent=`שלום ${P.by}. כל מי שתוסיפו כאן יופיע ברשימת המוזמנים שלהם.`;
  renderMine();$("#g-name").focus();
}

if(!sealed){$("#sub").textContent="הקישור לא שלם. בקשו מבני הזוג לשלוח אותו שוב.";}
else{
  const saved=store.get(KEY);
  if(saved&&saved.t){P=saved;opened()} else $("#unlock").hidden=false;
}
$("#unlock").addEventListener("submit",async e=>{e.preventDefault();
  const b=$("#unlock-go");b.disabled=true;b.textContent="בודק…";msg($("#unlock-msg"),"");
  try{P=await unseal($("#pw").value.trim());store.set(KEY,P);opened()}
  catch(err){msg($("#unlock-msg"),"הסיסמה לא נכונה.","bad")}
  b.disabled=false;b.textContent="כניסה";
});
$("#add").addEventListener("submit",async e=>{e.preventDefault();
  const name=$("#g-name").value.trim();if(!name)return;
  const g={id:rid(),name,count:Math.max(1,Math.min(50,parseInt($("#g-count").value)||1)),group:$("#g-group").value,phone:$("#g-phone").value.trim(),notes:$("#g-notes").value.trim()};
  const b=$("#add-go");b.disabled=true;b.textContent="שולח…";
  try{await send([g]);remember([g]);msg($("#add-msg"),`${name} נוסף/ה לרשימה ✓`,"ok");
    $("#g-name").value="";$("#g-phone").value="";$("#g-notes").value="";$("#g-count").value="2";$("#g-name").focus()}
  catch(err){msg($("#add-msg"),typeof err==="string"?err:"השליחה נכשלה. נסו שוב.","bad")}
  b.disabled=false;b.textContent="הוספה לרשימה";
});
$("#bulk-toggle").addEventListener("click",()=>{$("#bulk").hidden=!$("#bulk").hidden});
$("#bulk-go").addEventListener("click",async()=>{
  const lines=$("#bulk-text").value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  const group=$("#g-group").value;
  const gs=lines.slice(0,300).map(line=>{const m=line.match(/^(.*?)[,\t]\s*(\d+)\s*$/);return {id:rid(),name:m?m[1].trim():line,count:m?Math.min(50,+m[2]):1,group,phone:"",notes:""}});
  const b=$("#bulk-go");b.disabled=true;b.textContent="שולח…";
  try{await send(gs);remember(gs);$("#bulk-text").value="";msg($("#add-msg"),`נוספו ${gs.length} הזמנות ✓`,"ok")}
  catch(err){msg($("#add-msg"),typeof err==="string"?err:"השליחה נכשלה. נסו שוב.","bad")}
  b.disabled=false;b.textContent="הוספת כל הרשימה";
});
$("#lock").addEventListener("click",()=>{store.del(KEY);location.reload()});
</script>
</body>
</html>
